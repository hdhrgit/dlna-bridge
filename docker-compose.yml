services:
  dlna:
    # The published image. `docker compose up -d --build` builds it from this source instead.
    image: ghcr.io/hdhrgit/dlna-bridge:0.99.11
    build: .
    restart: unless-stopped
    init: true # reaps the ffmpegs
    # Discovery is UDP multicast on the LAN, which a bridged container never sees.
    network_mode: host
    volumes:
      - dlna-state:/var/lib/dlna
    environment:
      # The DVR, as this container reaches it. With host networking and the DVR on
      # the same machine, localhost works, and the TVs are sent to this machine's
      # LAN address on the same port.
      DLNA_DVR: http://localhost:8089
      DLNA_NAME: Channels DVR
      # Optional: the address to announce, when this machine has several and TVs
      # pick the wrong one.
      # DLNA_ADVERTISE: 192.168.1.10
volumes:
  dlna-state:
