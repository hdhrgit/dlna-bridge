name: build
# Builds the release files for every push to main, as the Gitea workflow does, and
# keeps them as the run's artifacts, so that the two can be compared.
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: version
        id: v
        run: echo "version=$(packaging/version.sh)" | tee -a "$GITHUB_OUTPUT"
      - name: tools
        run: |
          sudo apt-get install -y zip
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
      - name: build
        run: packaging/build.sh "${{ steps.v.outputs.version }}"
      - name: report
        # So that a build here and the same build elsewhere can be compared.
        run: |
          go version
          sha256sum build/*/dlna-bridge build/*/dlna-bridge.exe
          (cd dist && sha256sum *)
      - name: keep
        uses: actions/upload-artifact@v4
        with:
          name: dlna-bridge-${{ steps.v.outputs.version }}
          path: dist/*
          if-no-files-found: error
